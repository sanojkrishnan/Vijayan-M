<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting Machine UI</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" href="props/PNG copy.png" />
</head>

<body>
    <div class="not-confirm">
        <div class="confirmation-not">
            <div class="not-checked"></div>
        </div>
    </div>
    <div class="show-vikasanam">
        <h2>വികസന വെട്ടമേകി റാന്തൽ, നമ്മുടെ ചിഹ്നം റാന്തൽ </h2>

        <p>നാട്ടിൽ ഇതുവരെ ഇടതുമുന്നണി ചെയ്ത വികസന പ്രവർത്തനങ്ങൾ കാണാൻ താഴെ ക്ലിക്ക് ചെയ്യൂ</p>
        <a href="vijayan.html">Click Here</a>
    </div>

    <div class="tabs">
        <button class="tab active">Ward</button>
        <button class="tab">Block</button>
        <button class="tab">District</button>
    </div>


    <div class="ballot-box">
        <div class="top-bar">
            <span>Ready <span class="dot"></span></span>
            <span>Ballot Unit 1</span>
        </div>


        <table>
            <tbody>
                <tr>
                    <td class="num">1</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">2</td>
                    <td class="candidate">
                        <div class="details">
                            <div class="vijayan">വിജയൻ മണക്കാട്ട്</div>
                            <div class="bla"><img class="logo" src="props/logo.png" alt="logo">
                            </div>
                        </div>
                    </td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn" onclick="voteButton()"></button>
                        <audio id="beep" src="props/music.mpeg"></audio>
                    </td>
                </tr>
                <tr>
                    <td class="num">3</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">4</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">5</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">6</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">7</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">8</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">9</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
                <tr>
                    <td class="num">10</td>
                    <td></td>
                    <td class="symbol">
                        <div class="light"></div>
                    </td>
                    <td><button class="vote-btn"></button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="index.js"></script>
</body>

</html>
